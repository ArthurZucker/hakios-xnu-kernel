# devices/b651/device.conf: what this device repository is (docs/porting/repositories.md has every word).
# Status is what has been verified on the phone. Nothing has: this is a port that has not booted yet.
# SCOPE.md next to this file is the list of the work, gate by gate.

device b651
	title       Bigme HiBreak Pro
	vendor      Bigme
	soc         mt6877
	defconfig   b651_defconfig
	maintainer  Arthur (fork)
	status      display     missing   the panel is e-ink (Bigme's EPD controller and waveforms); no such driver exists in the kernel
	status      touch       missing   the panel's touch layer; there is no driver for this phone's controller yet
	status      buttons     missing   the keys read through MediaTek's PMIC (PMIF), not the Qualcomm SPMI arbiter hakios.buttons.c walks
	status      cpu         missing   CONFIG_CPUS=8 and bootcpu=7 are set, but nothing has run on the phone
	status      gpu         missing   Mali-G68 MC4; the kernel's GPU work is Adreno-only (hakios.adreno.c), and Metal has no Mali path
	status      storage     missing   UFS 2.2 on MediaTek's UFS host controller; hakios.ufshc.c is the Qualcomm one
	status      audio       missing   MediaTek audio DSP; hakios.adsp.c is the Qualcomm ADSP loader
	status      battery     missing   the gauge sits behind MediaTek's PMIC and charger blocks
	status      haptic      missing   no driver for this phone's motor
	status      camera      missing   MediaTek ISP (not the Qualcomm one hakios.camera.c speaks to)
	status      torch       missing   the flash LED is on a MediaTek PMIC
	status      wifi        missing   MediaTek/Connectivity combo radio; the kernel's Wi-Fi path is the Qualcomm WCN6750
	status      bluetooth   missing   same radio
	status      cellular    missing   the modem is MediaTek's, not the Qualcomm MDM the IPA/QMI path is written for
	status      thermal     missing   MediaTek LVTS thermal controller
	status      usb         missing   MediaTek USB device controller; the RAM-only boot path needs it for xl ramdisk
